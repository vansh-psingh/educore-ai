<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EDUCORE AI — Admin</title>
<link rel="icon" type="image/svg+xml" href="/static/brand/educore-symbol.svg">
<link rel="stylesheet" href="/static/css/dashboard.css">
<style>
  body { margin:0; }
  .admin-wrap { display:flex; min-height:100vh; }
  .admin-side { width:230px; background:var(--sidebar-bg,#0d1330); border-right:1px solid var(--border); padding:20px 14px; flex-shrink:0; }
  .admin-brand { font-weight:800; font-size:18px; margin-bottom:24px; }
  .admin-brand span { color:var(--cyan,#22d3ee); }
  .admin-nav { display:flex; flex-direction:column; gap:4px; }
  .admin-nav button { background:none;border:none;color:var(--text);text-align:left;padding:10px 12px;border-radius:8px;cursor:pointer;font-size:14px; }
  .admin-nav button.active, .admin-nav button:hover { background:rgba(124,58,237,.18); color:#fff; }
  .admin-main { flex:1; padding:28px; overflow:auto; }
  .stat-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(180px,1fr)); gap:14px; margin-bottom:22px; }
  .stat-card { background:var(--card-bg,#131a33); border:1px solid var(--border); border-radius:12px; padding:16px; }
  .stat-card .num { font-size:26px; font-weight:800; }
  .stat-card .lbl { color:var(--muted); font-size:12px; margin-top:4px; }
  table.admin-table { width:100%; border-collapse:collapse; font-size:14px; }
  table.admin-table th, table.admin-table td { text-align:left; padding:10px 12px; border-bottom:1px solid var(--border); }
  table.admin-table th { color:var(--muted); font-size:12px; text-transform:uppercase; }
  .role-badge { padding:2px 10px; border-radius:20px; font-size:12px; font-weight:600; }
  .role-student { background:#22d3ee22; color:#67e8f9; }
  .role-teacher { background:#a78bfa22; color:#c4b5fd; }
  .role-admin { background:#f8717122; color:#fca5a5; }
  .status-active { color:#4ade80; } .status-suspended { color:#fbbf24; } .status-deactivated { color:#f87171; }
  .filters { display:flex; gap:10px; flex-wrap:wrap; margin-bottom:14px; }
  .filters input, .filters select { background:var(--input-bg,#0d1330); border:1px solid var(--border); color:var(--text); padding:8px 12px; border-radius:8px; }
  .pager { display:flex; gap:8px; align-items:center; margin-top:14px; }
  .pager button { background:var(--card-bg,#131a33); border:1px solid var(--border); color:var(--text); padding:6px 14px; border-radius:8px; cursor:pointer; }
  .modal-bg { position:fixed; inset:0; background:rgba(0,0,0,.6); display:none; align-items:center; justify-content:center; z-index:50; }
  .modal-bg.open { display:flex; }
  .modal { background:var(--card-bg,#131a33); border:1px solid var(--border); border-radius:14px; padding:24px; width:min(560px,92vw); max-height:85vh; overflow:auto; }
  .kv { display:grid; grid-template-columns:140px 1fr; gap:8px 16px; font-size:14px; margin:12px 0; }
  .kv b { color:var(--muted); font-weight:600; }
  #toast { position:fixed; bottom:20px; left:50%; transform:translateX(-50%); background:#7c3aed; color:#fff; padding:10px 20px; border-radius:8px; display:none; z-index:99; }
  @media (max-width:800px){ .admin-side{width:64px}.admin-nav button span{display:none}.admin-main{padding:16px} }
</style>
</head>
<body>
<div class="admin-wrap">
  <aside class="admin-side">
    <div class="admin-brand"><img src="/static/brand/educore-symbol.svg" alt="" style="width:34px;height:34px;vertical-align:-8px;margin-right:10px">EDUCORE <span>ADMIN</span></div>
    <nav class="admin-nav" id="adminNav">
      <button data-sec="overview" class="active">Overview</button>
      <button data-sec="users">Users</button>
      <button data-sec="audit">Audit log</button>
      <button data-sec="health">System health</button>
      <button data-sec="notify">Notifications</button>
    </nav>
    <div style="margin-top:auto;padding-top:20px">
      <a href="/" class="muted" style="font-size:13px">← Back to app</a>
    </div>
  </aside>
  <main class="admin-main" id="adminMain"></main>
</div>
<div class="modal-bg" id="modalBg"><div class="modal" id="modal"></div></div>
<div id="toast"></div>
<script src="/static/js/icons.js"></script>
<script src="/static/js/api.js"></script>
<script src="/static/js/admin.js"></script>
</body>
</html>
